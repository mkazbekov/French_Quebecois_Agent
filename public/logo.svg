<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quebec French Tutor">
  <!--
    Québec French Tutor mark ("Accent"): a Québec-blue rounded square and one
    paper-white speech bubble with an accent aigu punched out of it by the
    even-odd fill rule. viewBox is 0 0 512 512.

    The two path strings below are the single source of truth: they are copied
    verbatim into src/app/icon.svg, and scripts/make-icons.ps1 re-renders the
    same strings with WPF (Geometry.Parse, where F0 is the even-odd rule) to
    produce the raster PNG/ICO icons, so the SVG favicon and the
    Windows/desktop icons never drift apart.

    Two draws, two colours, no nesting - which is what survives being 16px.
  -->
  <!-- Québec blue rounded square, expressed as a path so WPF and SVG share every coordinate -->
  <path
    d="M110,0 L402,0 A110,110 0 0 1 512,110 L512,402 A110,110 0 0 1 402,512 L110,512 A110,110 0 0 1 0,402 L0,110 A110,110 0 0 1 110,0 Z"
    fill="#1B3FAE"/>
  <!-- Speech bubble (rounded body + tail) with the accent aigu as an even-odd hole -->
  <path
    fill-rule="evenodd"
    d="M156,96 L356,96 A64,64 0 0 1 420,160 L420,304 A64,64 0 0 1 356,368 L268,368 L172,438 L196,368 L156,368 A64,64 0 0 1 92,304 L92,160 A64,64 0 0 1 156,96 Z M210,286 L328,208 L308,178 L190,256 Z"
    fill="#FDFBF7"/>
</svg>
