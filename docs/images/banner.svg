<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Québec French Voice Tutor: talk out loud, get answered in real Montréal French">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3fa8"/>
      <stop offset="1" stop-color="#071a45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc2ff"/>
      <stop offset="1" stop-color="#3b7bff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <!-- faint grid of dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="60" cy="40" r="2"/><circle cx="100" cy="40" r="2"/><circle cx="140" cy="40" r="2"/>
    <circle cx="60" cy="80" r="2"/><circle cx="100" cy="80" r="2"/><circle cx="140" cy="80" r="2"/>
    <circle cx="1180" cy="290" r="2"/><circle cx="1220" cy="290" r="2"/><circle cx="1180" cy="250" r="2"/><circle cx="1220" cy="250" r="2"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="118" fill="#9cc2ff" font-size="22" font-weight="600" letter-spacing="4">YOUR PERSONAL SPEAKING PARTNER</text>
    <text x="72" y="182" fill="#ffffff" font-size="60" font-weight="700">Québec French</text>
    <text x="72" y="244" fill="#ffffff" font-size="60" font-weight="700">Voice Tutor</text>
    <text x="72" y="292" fill="#c9dbff" font-size="24">Talk out loud. Get answered in real Montréal French.</text>
  </g>

  <!-- voice orb -->
  <circle cx="1000" cy="170" r="150" fill="url(#glow)"/>
  <circle cx="1000" cy="170" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1000" cy="170" r="82" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="1000" cy="170" r="62" fill="#2f6bff"/>
  <!-- waveform inside orb -->
  <g fill="#ffffff">
    <rect x="964" y="160" width="8" height="20" rx="4"/>
    <rect x="978" y="146" width="8" height="48" rx="4"/>
    <rect x="992" y="134" width="8" height="72" rx="4"/>
    <rect x="1006" y="150" width="8" height="40" rx="4"/>
    <rect x="1020" y="140" width="8" height="60" rx="4"/>
    <rect x="1034" y="158" width="8" height="24" rx="4"/>
  </g>

  <!-- speech bubbles -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="1060" y="56" width="172" height="48" rx="24" fill="#ffffff"/>
    <path d="M1078 100 L1066 118 L1094 102 Z" fill="#ffffff"/>
    <text x="1146" y="87" fill="#0a3fa8" text-anchor="middle">Allô! On jase?</text>

    <rect x="740" y="236" width="190" height="48" rx="24" fill="#22c55e"/>
    <path d="M912 240 L930 222 L900 238 Z" fill="#22c55e"/>
    <text x="835" y="267" fill="#ffffff" text-anchor="middle">Oui, avec plaisir!</text>
  </g>
</svg>
